name: ci
on:
  push: { branches: [main, develop, 'feat/**', 'chore/**'] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: storekeeper, POSTGRES_PASSWORD: storekeeper, POSTGRES_DB: storekeeper_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storekeeper" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://storekeeper:storekeeper@localhost:5432/storekeeper_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install promtool (alert rules are validated and unit-tested in npm test)
        run: |
          curl -sSfL -o prom.tgz https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz
          echo "31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f  prom.tgz" | sha256sum -c -
          tar xzf prom.tgz --strip-components=1 prometheus-2.54.1.linux-amd64/promtool && sudo mv promtool /usr/local/bin/ && promtool --version
      - run: npm run lint          # tsc --noEmit
      - run: npm run build
      - run: npm test              # real Postgres + Redis; migrations applied by the test harness
      - run: npm run audit         # fails on moderate+ advisories in production dependencies
      - name: OpenAPI is up to date
        run: |
          npm run openapi
          git diff --exit-code docs/openapi.json
